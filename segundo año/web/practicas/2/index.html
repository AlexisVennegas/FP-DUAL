<html lang="es">

<head>
    <title>Galería de 6 imágenes</title>
    <style>
        .galeria {
            display: grid;
            /* Activa el modo Grid */
            grid-template-columns: repeat(3, 1fr);
            /* Crea 3 columnas de igual tamaño */
            gap: 16px;
            /* Opcional: añade espacio entre las celdas */
            gap: 15px;
            max-width: 400px;
            margin: 30px auto;
        }


        /* // para que la imagen se vea bien y el globo no se vea cortado, se puede cambiar el height a auto y quitar el object-fit: cover */
        img {
            height: auto;
            object-fit: contain;
            width: 150px;
            margin: 0 auto;
            cursor: crosshair;
        }
    </style>
</head>

<body>
    <div class="galeria">
        <img class="imagen1" src="../imagenes/globo rojo.avif" alt="Imagen 1">
        <img class="imagen2" src="../imagenes/globo rojo.avif" alt="Imagen 2">
        <img class="imagen3" src="../imagenes/globo rojo.avif" alt="Imagen 3">
        <img class="imagen4" src="../imagenes/globo rojo.avif" alt="Imagen 4">
        <img class="imagen5" src="../imagenes/globo rojo.avif" alt="Imagen 5">
        <img class="imagen6" src="../imagenes/globo rojo.avif" alt="Imagen 6">
        <img class="imagen4" src="../imagenes/globo rojo.avif" alt="Imagen 4">
        <img class="imagen5" src="../imagenes/globo rojo.avif" alt="Imagen 5">
        <img class="imagen6" src="../imagenes/globo rojo.avif" alt="Imagen 6">
    </div>



    <script src="index.js"></script>
</body>

</html>
